[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xaue-mcp-server"
version = "0.1.0"
description = "A Model Context Protocol (MCP) server for XAUE on-chain query tools."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["mcp", "xaue", "xaut", "ethereum", "defi", "gold"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "mcp",
    "web3",
]

[project.scripts]
xaue-mcp-server = "xaue_mcp_server:run"

[project.urls]
Homepage = "https://github.com/xauecom/xaue-mcp-server"
Repository = "https://github.com/xauecom/xaue-mcp-server"
Issues = "https://github.com/xauecom/xaue-mcp-server/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/xaue_mcp_server"]
